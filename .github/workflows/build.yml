name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n build.sh install.command test.sh
      - name: Test node discovery and alert rules
        run: ./test.sh
      - name: Build signed app bundle
        run: ./build.sh --build-only
      - name: Archive app bundle
        run: ditto -c -k --keepParent dist/NodeBar.app dist/NodeBar.zip
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: NodeBar-macos
          path: dist/NodeBar.zip

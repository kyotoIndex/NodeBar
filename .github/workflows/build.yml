name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n build.sh install.command test.sh package.sh
      - name: Test node discovery and alert rules
        run: ./test.sh
      - name: Build and package bilingual universal apps
        run: ./package.sh
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: NodeBar-macOS-English-Chinese
          path: dist/NodeBar-*-macOS-*.zip
